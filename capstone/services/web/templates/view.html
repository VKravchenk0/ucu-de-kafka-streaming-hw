<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Analytics — {{ session_id[:8] }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e0e0e0;
           min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #1e1e2e;
             display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.1rem; color: #fff; }
    header .sid { font-size: 0.75rem; color: #555; font-family: monospace; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .badge-live { background: #1a3d1a; color: #4caf50; }
    .badge-done { background: #2a2a1a; color: #ffc107; }
    .badge-wait { background: #1a1a2a; color: #888; }
    main { display: flex; flex: 1; gap: 0; }
    .video-wrap { position: relative; flex: 1; background: #000; display: flex;
                  align-items: center; justify-content: center; }
    video { max-width: 100%; max-height: calc(100vh - 56px); display: block; }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    aside { width: 260px; min-width: 220px; background: #13131c; border-left: 1px solid #1e1e2e;
            padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
    .stat-group { background: #1a1a24; border: 1px solid #2e2e44; border-radius: 8px; padding: 1rem; }
    .stat-group h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
                     color: #666; margin-bottom: 0.75rem; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline;
                margin-bottom: 0.4rem; font-size: 0.9rem; }
    .stat-row .label { color: #aaa; }
    .stat-row .value { font-size: 1.2rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .stat-row .value.car { color: #ff9800; }
    .stat-row .value.person { color: #29b6f6; }
    .info { font-size: 0.78rem; color: #555; line-height: 1.5; }
    a.back { font-size: 0.85rem; color: #6c63ff; text-decoration: none; }
    a.back:hover { text-decoration: underline; }
    .ws-status { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px;
                 background: #1a1a2a; color: #666; }
    .ws-status.connected { color: #4caf50; background: #0f2a0f; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="/">&#8592; Upload another</a>
    <h1>Live Analytics</h1>
    <span class="sid">{{ session_id }}</span>
    <span class="badge badge-wait" id="status-badge">Waiting…</span>
    <span class="ws-status" id="ws-status">WS: connecting</span>
  </header>

  <main>
    <div class="video-wrap" id="video-wrap">
      <video id="vid" src="/video/{{ session_id }}" controls autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <aside>
      <div class="stat-group">
        <h3>This Session</h3>
        <div class="stat-row"><span class="label">Cars in frame</span><span class="value car" id="cars-frame">—</span></div>
        <div class="stat-row"><span class="label">Cars total</span><span class="value car" id="cars-total">—</span></div>
        <div class="stat-row"><span class="label">People in frame</span><span class="value person" id="persons-frame">—</span></div>
        <div class="stat-row"><span class="label">People total</span><span class="value person" id="persons-total">—</span></div>
      </div>

      <div class="info" id="info-box">
        Video is loading. Detection boxes will appear within a few seconds after the pipeline processes the first frames.
      </div>
    </aside>
  </main>

  <script>
    const SESSION_ID = "{{ session_id }}";
    const vid = document.getElementById('vid');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    // Position canvas to cover exactly the rendered video element.
    // The video is flex-centered inside .video-wrap, so top/left are NOT 0.
    function syncCanvas() {
      const vr = vid.getBoundingClientRect();
      const wr = vid.parentElement.getBoundingClientRect();
      const offsetLeft = vr.left - wr.left;
      const offsetTop  = vr.top  - wr.top;
      canvas.style.left   = offsetLeft + 'px';
      canvas.style.top    = offsetTop  + 'px';
      canvas.style.width  = vr.width   + 'px';
      canvas.style.height = vr.height  + 'px';
      // Internal resolution = video's natural pixel dimensions for correct bbox scaling
      canvas.width  = vid.videoWidth  || vr.width;
      canvas.height = vid.videoHeight || vr.height;
    }
    vid.addEventListener('loadedmetadata', syncCanvas);
    vid.addEventListener('play', syncCanvas);
    window.addEventListener('resize', syncCanvas);

    // -----------------------------------------------------------------------
    // Overlay buffer: Map from video_timestamp_ms -> overlay payload
    // We keep the latest N entries and find the one closest to currentTime
    // -----------------------------------------------------------------------
    // Detection runs faster than video playback — buffer all frames for the whole video.
    // Exposed on window so you can inspect from DevTools console: window.overlayBuffer.size
    const overlayBuffer = new Map();
    window.overlayBuffer = overlayBuffer;

    function addOverlay(payload) {
      overlayBuffer.set(payload.video_timestamp_ms, payload);
    }

    function findClosestOverlay(currentMs, toleranceMs = 2000) {
      let best = null;
      let bestDiff = Infinity;
      for (const [ts, payload] of overlayBuffer) {
        const diff = Math.abs(ts - currentMs);
        if (diff < bestDiff) { bestDiff = diff; best = payload; }
      }
      return bestDiff <= toleranceMs ? best : null;
    }

    // -----------------------------------------------------------------------
    // Drawing
    // -----------------------------------------------------------------------
    const COLORS = { car: '#ff9800', person: '#29b6f6' };

    function drawBoxes(overlay) {
      syncCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!overlay) return;

      const scaleX = canvas.width  / 640;
      const scaleY = canvas.height / 640;

      function drawTrack(t, color, label) {
        if (!t.bbox) return;
        const [x1, y1, x2, y2] = t.bbox;
        const sx = x1 * scaleX, sy = y1 * scaleY;
        const sw = (x2 - x1) * scaleX, sh = (y2 - y1) * scaleY;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(sx, sy, sw, sh);

        const text = `${label} ${t.track_id}`;
        ctx.font = 'bold 13px system-ui';
        const tw = ctx.measureText(text).width;
        ctx.fillStyle = color;
        ctx.fillRect(sx - 1, sy - 20, tw + 8, 20);
        ctx.fillStyle = '#000';
        ctx.fillText(text, sx + 3, sy - 5);
      }

      (overlay.car_tracks    || []).forEach(t => drawTrack(t, COLORS.car,    'Car'));
      (overlay.person_tracks || []).forEach(t => drawTrack(t, COLORS.person, 'Person'));
    }

    // Animation loop
    let _dbgTick = 0;
    function animate() {
      const currentMs = vid.currentTime * 1000;
      const overlay = findClosestOverlay(currentMs);
      drawBoxes(overlay);

      if (overlay) {
        setEl('cars-frame',    overlay.cars_in_frame    ?? '—');
        setEl('cars-total',    overlay.cars_total       ?? '—');
        setEl('persons-frame', overlay.persons_in_frame ?? '—');
        setEl('persons-total', overlay.persons_total    ?? '—');
      }

      // Log every ~3 seconds so you can verify data in the browser console
      if (++_dbgTick % 180 === 0) {
        console.log(`[overlay] t=${currentMs.toFixed(0)}ms buffer=${overlayBuffer.size} overlay=${overlay ? JSON.stringify({cars:overlay.cars_in_frame, persons:overlay.persons_in_frame}) : 'null'}`);
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // -----------------------------------------------------------------------
    // WebSocket
    // -----------------------------------------------------------------------
    const wsStatus = document.getElementById('ws-status');
    const statusBadge = document.getElementById('status-badge');
    const infoBox = document.getElementById('info-box');
    let wsRetries = 0;

    function setEl(id, val) { document.getElementById(id).textContent = val; }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws/${SESSION_ID}`);

      ws.onopen = () => {
        wsStatus.textContent = 'WS: live';
        wsStatus.classList.add('connected');
        statusBadge.textContent = 'Processing';
        statusBadge.className = 'badge badge-live';
        wsRetries = 0;
      };

      ws.onmessage = (e) => {
        const payload = JSON.parse(e.data);
        if (payload._done) {
          statusBadge.textContent = 'Done';
          statusBadge.className = 'badge badge-done';
          wsStatus.textContent = 'WS: done';
          wsStatus.classList.remove('connected');
          infoBox.textContent = `Processing complete. ${payload.total_frames} frames analysed.`;
          return;
        }
        addOverlay(payload);
      };

      ws.onclose = () => {
        wsStatus.textContent = 'WS: closed';
        wsStatus.classList.remove('connected');
        if (wsRetries < 5) {
          wsRetries++;
          setTimeout(connectWS, 2000 * wsRetries);
        }
      };
      ws.onerror = () => ws.close();
    }
    connectWS();

    // -----------------------------------------------------------------------
    // Global stats polling (every 3 seconds)
    // -----------------------------------------------------------------------
  </script>
</body>
</html>
