  schema-registry:
    profiles: [infra]
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  connect:
    profiles: [infra]
    image: cnfldemos/cp-server-connect-datagen:0.6.4-7.6.0
    hostname: connect
    container_name: connect
    depends_on:
      - broker
      - schema-registry
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # CLASSPATH required due to CC-2422
      CLASSPATH: /usr/share/java/monitoring-interceptors/monitoring-interceptors-8.2.0.jar
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor"
      CONNECT_CONSUMER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"

  prometheus:
    profiles: [infra]
    image: confluentinc/cp-enterprise-prometheus:2.5.0
    hostname: cp-enterprise-prometheus
    container_name: prometheus
    volumes:
      - ./vol/config:/mnt/config
    ports:
      - "9090:9090"
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: false

  alertmanager:
    profiles: [infra]
    image: confluentinc/cp-enterprise-alertmanager:2.5.0
    hostname: cp-enterprise-alertmanager
    container_name: alertmanager
    depends_on:
      - prometheus
    volumes:
      - ./vol/config:/mnt/config
    ports:
      - "9099:9093"
    environment:
      CONFIG_PATH: "/mnt/config"
      SHOULD_LOG_TO_FILE: false

  control-center:
    profiles: [infra]
    image: confluentinc/cp-enterprise-control-center-next-gen:2.5.0
    hostname: control-center
    container_name: control-center
    depends_on:
      - broker
      - schema-registry
      - connect
      - ksqldb-server
      - prometheus
      - alertmanager
    ports:
      - "9021:9021"
    volumes:
      - ./vol/config:/mnt/config
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect:8083'
      CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: '/connectors'
      CONTROL_CENTER_KSQL_KSQLDB1_URL: "http://ksqldb-server:8088"
      CONTROL_CENTER_KSQL_KSQLDB1_ADVERTISED_URL: "http://localhost:8088"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_PROMETHEUS_ENABLE: true
      CONTROL_CENTER_PROMETHEUS_URL: http://prometheus:9090
      CONTROL_CENTER_PROMETHEUS_RULES_FILE: /mnt/config/trigger_rules-generated.yml
      CONTROL_CENTER_ALERTMANAGER_URL: http://alertmanager:9093
      CONTROL_CENTER_ALERTMANAGER_CONFIG_FILE: /mnt/config/alertmanager-generated.yml
      PORT: 9021

  ksqldb-server:
    profiles: [infra]
    image: confluentinc/cp-ksqldb-server:8.2.0
    hostname: ksqldb-server
    container_name: ksqldb-server
    depends_on:
      - broker
      - connect
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "broker:29092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KSQL_KSQL_CONNECT_URL: "http://connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: 'true'
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: 'true'

  rest-proxy:
    profiles: [infra]
    image: confluentinc/cp-kafka-rest:8.2.0
    depends_on:
      - broker
      - schema-registry
    ports:
      - 8082:8082
    hostname: rest-proxy
    container_name: rest-proxy
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: 'broker:29092'
      KAFKA_REST_LISTENERS: "http://0.0.0.0:8082"
      KAFKA_REST_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'

  flink-sql-client:
    profiles: [infra]
    image: cnfldemos/flink-sql-client-kafka:1.19.1-scala_2.12-java17
    depends_on:
      - flink-jobmanager
    hostname: flink-sql-client
    container_name: flink-sql-client
    environment:
      FLINK_JOBMANAGER_HOST: flink-jobmanager

  flink-jobmanager:
    profiles: [infra]
    image: cnfldemos/flink-kafka:1.19.1-scala_2.12-java17
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
    - 9081:9081
    command: jobmanager
    environment:
    - |
      FLINK_PROPERTIES=
      jobmanager.rpc.address: flink-jobmanager
      rest.bind-port: 9081

  flink-taskmanager:
    profiles: [infra]
    image: cnfldemos/flink-kafka:1.19.1-scala_2.12-java17
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
    - flink-jobmanager
    command: taskmanager
    scale: 1
    environment:
    - |
      FLINK_PROPERTIES=
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 10

  # ---------------------------------------------------------------------------
  # Application services  (docker compose --profile app up -d)
  # ---------------------------------------------------------------------------

  topic-init:
    profiles: [app]
    build:
      context: ./services
      dockerfile: topic_init/Dockerfile
    container_name: topic-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
    restart: "no"

  ksql-init:
    profiles: [app]
    build:
      context: ./services
      dockerfile: ksql_init/Dockerfile
    container_name: ksql-init
    environment:
      KSQLDB_URL: http://ksqldb-server:8088
    depends_on:
      - topic-init
    restart: "no"

  generator:
    profiles: [app]
    build:
      context: ./services
      dockerfile: generator/Dockerfile
    container_name: generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      FRAME_INTERVAL: "3"
      JPEG_QUALITY: "85"
    volumes:
      - uploads:/uploads
    depends_on:
      - topic-init
    restart: unless-stopped

  preprocessor:
    profiles: [app]
    build:
      context: ./services
      dockerfile: preprocessor/Dockerfile
    container_name: preprocessor
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      TARGET_SIZE: "640"
    depends_on:
      - topic-init
    restart: unless-stopped

  car-detector:
    profiles: [app]
    image: capstone-car-detector:${PROCESSING_UNIT_TYPE:-cpu}
    build:
      context: ./services
      dockerfile: detector/Dockerfile
      args:
        PROCESSING_UNIT_TYPE: ${PROCESSING_UNIT_TYPE:-cpu}
    container_name: car-detector
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      CLASS_IDS: "2,5,7"
      OUTPUT_TOPIC: detections.cars
      GROUP_ID: detector-cars
      CONF_THRESHOLD: "0.4"
      PROCESSING_UNIT_TYPE: ${PROCESSING_UNIT_TYPE:-cpu}
    depends_on:
      - topic-init
    restart: unless-stopped

  person-detector:
    profiles: [app]
    image: capstone-person-detector:${PROCESSING_UNIT_TYPE:-cpu}
    build:
      context: ./services
      dockerfile: detector/Dockerfile
      args:
        PROCESSING_UNIT_TYPE: ${PROCESSING_UNIT_TYPE:-cpu}
    container_name: person-detector
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      CLASS_IDS: "0"
      OUTPUT_TOPIC: detections.persons
      GROUP_ID: detector-persons
      CONF_THRESHOLD: "0.4"
      PROCESSING_UNIT_TYPE: ${PROCESSING_UNIT_TYPE:-cpu}
    depends_on:
      - topic-init
    restart: unless-stopped

  car-tracker:
    profiles: [app]
    build:
      context: ./services
      dockerfile: tracker/Dockerfile
    container_name: car-tracker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      OBJECT_TYPE: car
      INPUT_TOPIC: detections.cars
      OUTPUT_TOPIC: tracking.cars
      GROUP_ID: tracker-car
    depends_on:
      - topic-init
    restart: unless-stopped

  person-tracker:
    profiles: [app]
    build:
      context: ./services
      dockerfile: tracker/Dockerfile
    container_name: person-tracker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      OBJECT_TYPE: person
      INPUT_TOPIC: detections.persons
      OUTPUT_TOPIC: tracking.persons
      GROUP_ID: tracker-person
    depends_on:
      - topic-init
    restart: unless-stopped

  statistics:
    profiles: [app]
    build:
      context: ./services
      dockerfile: statistics/Dockerfile
    container_name: statistics
    environment:
      KSQLDB_URL: http://ksqldb-server:8088
      HTTP_PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      - ksql-init
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ./services
      dockerfile: web/Dockerfile
    container_name: web
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      STATS_URL: http://statistics:8002/stats
      UPLOAD_DIR: /uploads
      HTTP_PORT: "8080"
      OVERLAY_BUFFER_DELAY_S: "4"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    depends_on:
      ksql-init:
        condition: service_completed_successfully
      generator:
        condition: service_started
    restart: unless-stopped

volumes:
  uploads:
